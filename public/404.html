<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>กำลังพาไปหน้าแอป...</title>
    <script>
      // GitHub Pages เสิร์ฟไฟล์นี้เมื่อหา path ที่ขอไม่เจอ (เช่น เปิดลิงก์เก่า/พิมพ์ผิด)
      // เนื่องจากแอปใช้ HashRouter ทุก route ที่ถูกต้องจะอยู่หลัง # อยู่แล้วไม่มาเจอหน้านี้
      // หน้านี้จึงทำหน้าที่แค่พากลับไปหน้าแรกของแอปให้เผื่อกรณี URL ผิดพลาดจริงๆเท่านั้น
      window.location.replace('./')
    </script>
  </head>
  <body>
    <p>กำลังพาไปหน้าแอป...</p>
  </body>
</html>
